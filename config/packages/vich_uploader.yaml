vich_uploader:
    db_driver: orm
    metadata:
        type: attribute
    mappings:
        app_data:
            uri_prefix: /app-data
            upload_destination: '%kernel.project_dir%/public/app-data'
            directory_namer: App\Service\CustomDirectoryNamer
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
